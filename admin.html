*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
header{background:var(--red);color:#fff;border-radius:16px;padding:18px;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:1.15rem}
input,textarea,select{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}

.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut)}
.qi{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}

function flagsOf(r) {

  if (!r.phone) f.push('Chưa có thông tin đăng ký');

  return f;
}
async function fetchRows() {

  const rows = sc.docs.map(d => {

    r.flags = flagsOf(r); return r;
  });
  const cnt = {}; rows.forEach(r => { if (r.phone) cnt[r.phone] = (cnt[r.phone] || 0) + 1 });
  rows.forEach(r => { if (r.phone && cnt[r.phone] > 1) r.flags.push('Số điện thoại trùng ' + cnt[r.phone] + ' dòng') });
  rows.sort((a, b) => b.score - a.score || (a.ms == null ? 1e12 : a.ms) - (b.ms == null ? 1e12 : b.ms) || a.at - b.at);

}

/* ---------- Câu hỏi ---------- */
function parse(text) {
  const lines = text.replace(/\*\*|__/g, '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const qs = [], key = {}; let cur = null, inKey = false, last = '', m;
  for (const l of lines) {
    if (/^[#\s]*ĐÁP ÁN/i.test(l)) { inKey = true; cur = null; continue }
    if (inKey) { for (const x of l.matchAll(/(\d+)\s*[.\-:]\s*([A-D])\b/g)) key[+x[1]] = x[2]; continue }
    if ((m = l.match(/^Câu\s*(\d+)\s*[.:)]\s*(.*)/i))) { cur = { n: +m[1], q: m[2], opts: [] }; qs.push(cur); last = 'q' }
    else if (cur && (m = l.match(/^Giải thích\s*[:.]\s*(.*)/i))) { cur.exp = m[1]; last = 'e' }
    else if (cur && (m = l.match(/^([A-D])\s*[.)]\s*(.*)/))) { cur.opts.push(m[2]); last = 'o' }
    else if (cur) { if (last === 'q') cur.q += ' ' + l; else if (last === 'e') cur.exp += ' ' + l; else if (cur.opts.length) cur.opts[cur.opts.length - 1] += ' ' + l }
  }
  const out = [], bad = [];
  qs.forEach(q => { if (q.opts.length === 4 && key[q.n]) out.push({ q: q.q, opts: q.opts, correct: 'ABCD'.indexOf(key[q.n]), ...(q.exp ? { exp: q.exp } : {}) }); else bad.push(q.n) });
  return { out, bad };
}

  r.onerror = no; r.readAsDataURL(file);
});

  const f = (lab, inp) => { c.appendChild(el('div', 'mut', lab)); c.appendChild(inp); return inp };
  const num = (v, mn, mx) => { const i = el('input'); i.type = 'number'; i.min = mn; i.max = mx; i.value = v; return i };
  const dt = v => { const i = el('input'); i.type = 'datetime-local'; if (v) i.value = new Date(v - new Date(v).getTimezoneOffset() * 6e4).toISOString().slice(0, 16); return i };
  const a = f('Số lượt chơi tối đa mỗi số điện thoại mỗi ngày (1–20)', num(d.perDay || 5, 1, 20));
  const b = f('Số câu hỏi mỗi lượt (5–40). Mọi người nhận cùng các câu đầu tiên của bộ câu hỏi.', num(d.perRound || 25, 5, 40));
  const t = f('Thời gian mỗi câu (giây, 10–60)', num(d.secs || 30, 10, 60));
  const st = f('Mở cuộc thi lúc (để trống = mở ngay)', dt(d.start)), en = f('Đóng cuộc thi lúc (để trống = không giới hạn)', dt(d.end));
  if (bank != null) c.appendChild(el('p', 'mut', `Bộ câu hỏi hiện có ${bank} câu. ` + (bank >= 4 ? (bank < (d.perRound || 25) ? 'Số câu mỗi lượt đang lớn hơn bộ câu hỏi nên mỗi lượt chỉ có ' + bank + ' câu.' : '') : 'Chưa đủ 4 câu nên trang chơi đang dùng bộ mẫu.')));
  const er = el('p', 'err', ''), sv = el('button', 'btn', 'Lưu cài đặt'); sv.style.marginTop = '10px';
  const read = () => ({ perDay: Math.round(+a.value), perRound: Math.round(+b.value), secs: Math.round(+t.value), start: st.value ? new Date(st.value).getTime() : 0, end: en.value ? new Date(en.value).getTime() : 0, at: Date.now() });
  sv.onclick = async () => {
    const v = read();
    if (!(v.perDay >= 1 && v.perDay <= 20 && v.perRound >= 5 && v.perRound <= 40 && v.secs >= 10 && v.secs <= 60)) { er.style.color = 'var(--red)'; er.textContent = 'Giá trị nằm ngoài khoảng cho phép.'; return }
    if (v.end && v.start && v.end <= v.start) { er.style.color = 'var(--red)'; er.textContent = 'Giờ đóng phải sau giờ mở.'; return }
    try { await setDoc(doc(db, 'config', 'main'), v, { merge: true }); er.style.color = 'var(--ok)'; er.textContent = 'Đã lưu. Trang chơi áp dụng cho người vào sau. Không nên đổi số câu hoặc thời gian mỗi câu khi cuộc thi đang diễn ra.' } catch (e) { er.style.color = 'var(--red)'; er.textContent = 'Không lưu được. Kiểm tra Rules và đăng nhập.' }
  };
  const cl = el('button', 'btn dan', '⏹ Đóng cuộc thi ngay'); cl.style.marginTop = '10px'; cl.style.width = '100%';
  cl.onclick = async () => {
    if (!confirm('Đóng cuộc thi ngay bây giờ? Người đang chơi dở vẫn kịp nộp bài trong thời gian tối đa của một lượt, nhưng không ai bắt đầu lượt mới được nữa.')) return;
    try { await setDoc(doc(db, 'config', 'main'), { end: Date.now(), at: Date.now() }, { merge: true }); en.value = dt(Date.now()).value; er.style.color = 'var(--ok)'; er.textContent = 'Đã đóng cuộc thi.' } catch (e) { er.style.color = 'var(--red)'; er.textContent = 'Không đóng được. Kiểm tra Rules và đăng nhập.' }
  };
  c.append(er, sv, cl);
}

/* ---------- Mã QR ---------- */
const QR_URLS = ['https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'];
async function loadQr() { if (window.qrcode) return; for (const u of QR_URLS) { try { await loadScript(u); if (window.qrcode) return } catch (e) { } } throw 0 }
function qrView(body) {
  body.textContent = ''; const c = el('div', 'card'); c.appendChild(el('h2', null, 'Mã QR dẫn tới cuộc thi'));
  const u = el('input'); u.value = location.href.replace(/admin\.html.*$/, '').replace(/[?#].*$/, '');
  const cv = el('canvas'); cv.style.cssText = 'max-width:100%;height:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px';
  const er = el('p', 'err', ''), bd = el('button', 'btn', '⬇ Tải ảnh mã QR (PNG) để in'); bd.style.marginTop = '10px';
  const draw = async () => {
    try {
      await loadQr(); const q = window.qrcode(0, 'M'); q.addData(u.value.trim()); q.make();
      const n = q.getModuleCount(), k = Math.floor(560 / (n + 8)), sz = k * (n + 8), W = 640, H = 900; cv.width = W; cv.height = H;
      const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.fillStyle = '#c8102e'; x.fillRect(0, 0, W, 170); x.textAlign = 'center';
      x.fillStyle = '#ffd400'; x.font = 'bold 26px sans-serif'; x.fillText('BAN CHQS PHƯỜNG LỘC NINH', W / 2, 60);
      x.fillStyle = '#fff'; x.font = 'bold 34px sans-serif'; x.fillText('CUỘC THI TÌM HIỂU NGÀY 22/12', W / 2, 115); x.font = '22px sans-serif'; x.fillText('Quân đội nhân dân Việt Nam', W / 2, 152);
      const ox = (W - sz) / 2; x.fillStyle = '#000';
      for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) x.fillRect(ox + (cc + 4) * k, 215 + (r + 4) * k, k, k);
      x.fillStyle = '#c8102e'; x.font = 'bold 30px sans-serif'; x.fillText('QUÉT MÃ ĐỂ THAM GIA', W / 2, 215 + sz + 50);
      x.fillStyle = '#444'; x.font = '20px sans-serif'; x.fillText(u.value.trim(), W / 2, 215 + sz + 90); er.textContent = '';
    } catch (e) { er.textContent = 'Không tạo được mã QR. Kiểm tra kết nối mạng.' }
  };
  u.oninput = draw; bd.onclick = () => cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'QR_cuoc_thi_22-12.png'; a.click() });
  c.append(el('p', 'mut', 'Địa chỉ cuộc thi (tự điền, có thể sửa):'), u, er, cv, bd); body.appendChild(c); draw();
}
